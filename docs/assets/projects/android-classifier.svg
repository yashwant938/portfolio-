<svg xmlns="http://www.w3.org/2000/svg" class="standalone" viewBox="0 0 800 480" role="img" aria-labelledby="android-classifier-title android-classifier-desc">
<title id="android-classifier-title">Image classifier: a pocket-sized model</title><desc id="android-classifier-desc">A tilted dimensional phone scans floating image tiles and connects them to simple classification tags.</desc>
<defs>
<linearGradient id="android-classifier-bg" x2="1" y2="1"><stop stop-color="#173738"/><stop offset="1" stop-color="#102027"/></linearGradient>
<radialGradient id="android-classifier-glow"><stop stop-color="#8ec895" stop-opacity=".2"/><stop offset="1" stop-color="#8ec895" stop-opacity="0"/></radialGradient>
<linearGradient id="android-classifier-paper" x2=".9" y2="1"><stop stop-color="#fbf6e6"/><stop offset="1" stop-color="#c6d2bc"/></linearGradient>
<linearGradient id="android-classifier-glass" x2="1" y2="1"><stop stop-color="#bdf8da" stop-opacity=".48"/><stop offset=".5" stop-color="#a4e7d0" stop-opacity=".08"/><stop offset="1" stop-color="#90cfc7" stop-opacity=".36"/></linearGradient>
<linearGradient id="android-classifier-metal" x2=".9" y2="1"><stop stop-color="#cce5c0"/><stop offset=".45" stop-color="#608f85"/><stop offset="1" stop-color="#244d52"/></linearGradient>
<linearGradient id="android-classifier-violet" x2="1" y2="1"><stop stop-color="#d2c0fa"/><stop offset="1" stop-color="#8e78b1"/></linearGradient>
<filter id="android-classifier-shadow" x="-50%" y="-50%" width="200%" height="230%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<style>
.standalone .art-float{animation:android-classifier-float 4s ease-in-out 1;transform-box:fill-box;transform-origin:center}
.standalone .art-pulse{animation:android-classifier-pulse 4s ease-in-out 1}
.standalone .art-flow{animation:android-classifier-flow 4s ease-in-out 1}
@keyframes android-classifier-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes android-classifier-pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes android-classifier-flow{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:16}}
@media(prefers-reduced-motion:reduce){.standalone .art-float,.standalone .art-pulse,.standalone .art-flow{animation:none}}
</style><rect width="800" height="480" fill="url(#android-classifier-bg)"/><ellipse cx="420" cy="236" rx="355" ry="265" fill="url(#android-classifier-glow)"/>
