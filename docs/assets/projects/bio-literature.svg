<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" class="standalone" role="img" aria-labelledby="bio-literature-title bio-literature-desc">
    <title id="bio-literature-title">Bio Literature — connections across research</title><desc id="bio-literature-desc">A dimensional molecular sculpture rises over layered research papers. Teal, lilac, and lime nodes connected by shaded bonds evoke literature discovery in the life sciences.</desc>
    <defs>
      <radialGradient id="bio-literature-bg" cx="48%" cy="36%" r="76%"><stop stop-color="#233740"/><stop offset="1" stop-color="#0c1722"/></radialGradient>
      <linearGradient id="bio-literature-ivory" x2="0.85" y2="1"><stop stop-color="#fff5df"/><stop offset="1" stop-color="#c8c8b2"/></linearGradient>
      <linearGradient id="bio-literature-green" x2="0.9" y2="1"><stop stop-color="#d4f596"/><stop offset="1" stop-color="#70b692"/></linearGradient>
      <linearGradient id="bio-literature-purple" x2="0.8" y2="1"><stop stop-color="#d8c4ff"/><stop offset="1" stop-color="#8475b3"/></linearGradient>
      <linearGradient id="bio-literature-coral" x2="1" y2="1"><stop stop-color="#ffccae"/><stop offset="1" stop-color="#d58078"/></linearGradient>
      <radialGradient id="bio-literature-glass" cx="28%" cy="24%"><stop stop-color="#d6fff0"/><stop offset="0.35" stop-color="#77c4be"/><stop offset="1" stop-color="#286570"/></radialGradient>
      <filter id="bio-literature-shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="17" stdDeviation="15" flood-color="#030b14" flood-opacity="0.42"/></filter>
      <pattern id="bio-literature-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9bdaca" stroke-opacity="0.045"/></pattern>
    </defs>
    <style>
      .standalone .art-float { animation:bio-literature-float 4s ease-in-out 1; }
      .standalone .art-pulse { animation:bio-literature-pulse 4s ease-in-out 1; }
      .standalone .art-flow { stroke-dasharray:8 10; animation:bio-literature-flow 4s ease-in-out 1; }
      @keyframes bio-literature-float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-8px) } }
      @keyframes bio-literature-pulse { 0%,100% { opacity:1 } 50% { opacity:.65 } }
      @keyframes bio-literature-flow { 0%,100% { stroke-dashoffset:0 } 50% { stroke-dashoffset:36 } }
      @media(prefers-reduced-motion:reduce) { .standalone .art-float,.standalone .art-pulse,.standalone .art-flow { animation:none } }
    </style>
