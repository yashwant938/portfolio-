><path d="M649 250l12 0-12 14m-8 14 24-12" fill="none" stroke="#beebd8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M589 242v43m12-36v44m12-35v44" fill="none" stroke="#74b4ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="155" y="376" fill="#d4ddc9" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">OBJECTS</text><text x="639" y="376" fill="#d4ddc9" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">EXECUTABLE</text>
