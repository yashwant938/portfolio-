<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="eld-title eld-desc" class="standalone">
<title id="eld-title">Object files becoming an executable</title><desc id="eld-desc">An isometric linker processor joins two floating object modules and emits a tall executable artifact. Glowing circuits trace the linking pipeline.</desc>
<defs>
<radialGradient id="eld-bg" cx="48%" cy="43%" r="75%"><stop stop-color="#253829"/><stop offset=".55" stop-color="#142321"/><stop offset="1" stop-color="#101719"/></radialGradient>
<radialGradient id="eld-halo"><stop stop-color="#bde785" stop-opacity=".18"/><stop offset="1" stop-color="#bde785" stop-opacity="0"/></radialGradient>
<pattern id="eld-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8aa893" stroke-width=".6" opacity=".15"/></pattern>
<linearGradient id="eld-top-lime" x2="0.8" y2="1"><stop stop-color="#d8f3a1"/><stop offset="1" stop-color="#72984f"/></linearGradient><linearGradient id="eld-front-lime" x2="0.8" y2="1"><stop stop-color="#748a59"/><stop offset="1" stop-color="#283b28"/></linearGradient><linearGradient id="eld-side-lime" x2="0.8" y2="1"><stop stop-color="#385243"/><stop offset="1" stop-color="#182821"/></linearGradient><linearGradient id="eld-top-teal" x2="0.8" y2="1"><stop stop-color="#9ce5d2"/><stop offset="1" stop-color="#427c78"/></linearGradient><linearGradient id="eld-front-teal" x2="0.8" y2="1"><stop stop-color="#518780"/><stop offset="1" stop-color="#173d3e"/></linearGradient><linearGradient id="eld-side-teal" x2="0.8" y2="1"><stop stop-color="#355e64"/><stop offset="1" stop-color="#172e38"/></linearGradient><linearGradient id="eld-top-violet" x2="0.8" y2="1"><stop stop-color="#c5b9fc"/><stop offset="1" stop-color="#746399"/></linearGradient><linearGradient id="eld-front-violet" x2="0.8" y2="1"><stop stop-color="#7b6b9e"/><stop offset="1" stop-color="#322940"/></linearGradient><linearGradient id="eld-side-violet" x2="0.8" y2="1"><stop stop-color="#534465"/><stop offset="1" stop-color="#241f37"/></linearGradient>
</defs>
<style>.standalone .art-float{animation:eld-float 4s ease-in-out 1}.standalone .art-pulse{animation:eld-pulse 4s ease-in-out 1}.standalone .art-flow{stroke-dasharray:8 10;animation:eld-flow 4s ease-in-out 1}@keyframes eld-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes eld-pulse{0%,100%{opacity:1}50%{opacity:.5}}@keyframes eld-flow{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:36}}@media(prefers-reduced-motion:reduce){.standalone .art-float,.standalone .art-pulse,.standalone .art-flow{animation:none!important}}</style>
<rect width="800" height="480" fill="url(#eld-bg)"/><rect x="40" y="40" width="720" height="400" rx="4" fill="url(#eld-grid)"/>
<ellipse cx="400" cy="259" rx="290" ry="194" fill="url(#eld-halo)"/>
<ellipse cx="400" cy="373" rx="257" ry="45" fill="#071613" opacity=".55"/>
