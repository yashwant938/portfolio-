<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="filesystem-lab-title filesystem-lab-desc" class="standalone">
<title id="filesystem-lab-title">A branching filesystem in three dimensions</title><desc id="filesystem-lab-desc">An elevated root folder branches into three dimensional child folders, connected by luminous directory traversal paths.</desc>
<defs>
<radialGradient id="filesystem-lab-bg" cx="48%" cy="43%" r="75%"><stop stop-color="#253829"/><stop offset=".55" stop-color="#142321"/><stop offset="1" stop-color="#101719"/></radialGradient>
<radialGradient id="filesystem-lab-halo"><stop stop-color="#bde785" stop-opacity=".18"/><stop offset="1" stop-color="#bde785" stop-opacity="0"/></radialGradient>
<pattern id="filesystem-lab-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8aa893" stroke-width=".6" opacity=".15"/></pattern>
<linearGradient id="filesystem-lab-top-lime" x2="0.8" y2="1"><stop stop-color="#d8f3a1"/><stop offset="1" stop-color="#72984f"/></linearGradient><linearGradient id="filesystem-lab-front-lime" x2="0.8" y2="1"><stop stop-color="#748a59"/><stop offset="1" stop-color="#283b28"/></linearGradient><linearGradient id="filesystem-lab-side-lime" x2="0.8" y2="1"><stop stop-color="#385243"/><stop offset="1" stop-color="#182821"/></linearGradient><linearGradient id="filesystem-lab-top-teal" x2="0.8" y2="1"><stop stop-color="#9ce5d2"/><stop offset="1" stop-color="#427c78"/></linearGradient><linearGradient id="filesystem-lab-front-teal" x2="0.8" y2="1"><stop stop-color="#518780"/><stop offset="1" stop-color="#173d3e"/></linearGradient><linearGradient id="filesystem-lab-side-teal" x2="0.8" y2="1"><stop stop-color="#355e64"/><stop offset="1" stop-color="#172e38"/></linearGradient><linearGradient id="filesystem-lab-top-violet" x2="0.8" y2="1"><stop stop-color="#c5b9fc"/><stop offset="1" stop-color="#746399"/></linearGradient><linearGradient id="filesystem-lab-front-violet" x2="0.8" y2="1"><stop stop-color="#7b6b9e"/><stop offset="1" stop-color="#322940"/></linearGradient><linearGradient id="filesystem-lab-side-violet" x2="0.8" y2="1"><stop stop-color="#534465"/><stop offset="1" stop-color="#241f37"/></linearGradient>
</defs>
<style>.standalone .art-float{animation:filesystem-lab-float 4s ease-in-out 1}.standalone .art-pulse{animation:filesystem-lab-pulse 4s ease-in-out 1}.standalone .art-flow{stroke-dasharray:8 10;animation:filesystem-lab-flow 4s ease-in-out 1}@keyframes filesystem-lab-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes filesystem-lab-pulse{0%,100%{opacity:1}50%{opacity:.5}}@keyframes filesystem-lab-flow{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:36}}@media(prefers-reduced-motion:reduce){.standalone .art-float,.standalone .art-pulse,.standalone .art-flow{animation:none!important}}</style>
<rect width="800" height="480" fill="url(#filesystem-lab-bg)"/><rect x="40" y="40" width="720" height="400" rx="4" fill="url(#filesystem-lab-grid)"/>
<ellipse cx="400" cy="259" rx="290" ry="194" fill="url(#filesystem-lab-halo)"/>
<ellipse cx="400" cy="373" rx="257" ry="45" fill="#071613" opacity=".55"/>
<path d="M74 362 400 432 726 362M108 326 400 390 692 326" fill="none" stroke="#557463" opacity=".24"/>
<path d="M400 174v64M400 230l-183 66M400 230l184 66M400 230v113" fill="none" stroke="#527e6e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M400 174v56l-183 66M400 230l184 66M400 230v113" fill="none" stroke="#c2df96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="art-flow"/><polygon points="400,220 419,230 400,240 381,230" fill="#cae694" stroke="#efffcf" stroke-width="1.2" stroke-linejoin="round" /><g class="art-float"><g transform="translate(400 135) skewY(-9) scale(1.15)"><polygon points="-58,-40 -18,-40 -4,-27 62,-27 62,47 -58,47" fill="url(#filesystem-lab-side-lime)" stroke="#7f9b7c" stroke-width="1.2" stroke-linejoin="round" /><polygon points="-58,-40 -41,-49 -1,-49 13,-36 -4,-27 -18,-40" fill="url(#filesystem-lab-top-lime)" stroke="#a6c6a4" stroke-width="1.2" stroke-linejoin="round" /><polygon points="62,-27 79,-36 79,38 62,47" fill="url(#filesystem-lab-side-lime)" stroke="#729488" stroke-width="1.2" stroke-linejoin="round" /><polygon points="-58,-13 62,-13 50,55 -70,55" fill="url(#filesystem-lab-front-lime)" stroke="#bcdaad" stroke-width="1.5" stroke-linejoin="round" /><path d="M-37 10H30M-41 25H4" fill="none" stroke="#d6e8c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g transform="translate(211 311) skewY(-9) scale(0.9)"><polygon points="-58,-40 -18,-40 -4,-27 62,-27 62,47 -58,47" fill="url(#filesystem-lab-side-teal)" stroke="#7f9b7c" stroke-width="1.2" stroke-linejoin="round" /><polygon points="-58,-40 -41,-49 -1,-49 13,-36 -4,-27 -18,-40" fill="url(#filesystem-lab-top-teal)" stroke="#a6c6a4" stroke-width="1.2" stroke-linejoin="round" /><polygon points="62,-27 79,-36 79,38 62,47" fill="url(#filesystem-lab-side-teal)" stroke="#729488" stroke-width="1.2" stroke-linejoin="round" /><polygon points="-58,-13 62,-13 50,55 -70,55" fill="url(#filesystem-lab-front-teal)" stroke="#bcdaad" stroke-width="1.5" stroke-linejoin="round" /><path d="M-37 10H30M-41 25H4" fill="none" stroke="#d6e8c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(585 311) skewY(-9) scale(0.9)"><polygon points="-58,-40 -18,-40 -4,-27 62,-27 62,47 -58,47" fill="url(#filesystem-lab-side-violet)" stroke="#7f9b7c" stroke-width="1.2" stroke-linejoin="round" /><polygon points="-58,-40 -41,-49 -1,-49 13,-36 -4,-27 -18,-40" fill="url(#filesystem-lab-top-violet)" stroke="#a6c6a4" stroke-width="1.2" stroke-linejoin="round" /><polygon points="62,-27 79,-36 79,38 62,47" fill="url(#filesystem-lab-side-violet)" stroke="#729488" stroke-width="1.2" stroke-linejoin="round" /><polygon points="-58,-13 62,-13 50,55 -70,55" fill="url(#filesystem-lab-front-violet)" stroke="#bcdaad" stroke-width="1.5" stroke-linejoin="round" /><path d="M-37 10H30M-41 25H4" fill="none" stroke="#d6e8c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="art-float"><g transform="translate(400 352) skewY(-9) scale(0.74)"><polygon points="-58,-40 -18,-40 -4,-27 62,-27 62,47 -58,47" fill="url(#filesystem-lab-side-teal)" stroke="#7f9b7c" stroke-width="1.2" stroke-linejoin="round" /><polygon points="-58,-40 -41,-49 -1,-49 13,-36 -4,-27 -18,-40" fill="url(#filesystem-lab-top-teal)" stroke="#a6c6a4" stroke-width="1.2" stroke-linejoin="round" /><polygon points="62,-27 79,-36 79,38 62,47" fill="url(#filesystem-lab-side-teal)" stroke="#729488" stroke-width="1.2" stroke-linejoin="round" /><polygon points="-58,-13 62,-13 50,55 -70,55" fill="url(#filesystem-lab-front-teal)" stroke="#bcdaad" stroke-width="1.5" stroke-linejoin="round" /><path d="M-37 10H30M-41 25H4" fill="none" stroke="#d6e8c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M157 261l-36 18v72l40 22M644 256l36 20v73l-43 22" fill="none" stroke="#527c70" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="121" cy="279" r="4" fill="#d1ef83"/><circle cx="680" cy="276" r="4" fill="#ac9bda"/><text x="400" y="433" fill="#d4ddc9" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">TRAVERSE · READ · ORGANIZE</text>
</svg>