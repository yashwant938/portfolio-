<svg xmlns="http://www.w3.org/2000/svg" class="standalone" viewBox="0 0 800 480" role="img" aria-labelledby="gpt2-summarization-title gpt2-summarization-desc">
<title id="gpt2-summarization-title">GPT-2: tokens into a summary</title><desc id="gpt2-summarization-desc">Dimensional token blocks pass through a small neural network and resolve into a compact floating summary card.</desc>
<defs>
<linearGradient id="gpt2-summarization-bg" x2="1" y2="1"><stop stop-color="#172f34"/><stop offset="1" stop-color="#0a1a22"/></linearGradient>
<radialGradient id="gpt2-summarization-glow"><stop stop-color="#afc988" stop-opacity=".2"/><stop offset="1" stop-color="#afc988" stop-opacity="0"/></radialGradient>
<linearGradient id="gpt2-summarization-paper" x2=".9" y2="1"><stop stop-color="#fbf6e6"/><stop offset="1" stop-color="#c6d2bc"/></linearGradient>
<linearGradient id="gpt2-summarization-glass" x2="1" y2="1"><stop stop-color="#bdf8da" stop-opacity=".48"/><stop offset=".5" stop-color="#a4e7d0" stop-opacity=".08"/><stop offset="1" stop-color="#90cfc7" stop-opacity=".36"/></linearGradient>
<linearGradient id="gpt2-summarization-metal" x2=".9" y2="1"><stop stop-color="#cce5c0"/><stop offset=".45" stop-color="#608f85"/><stop offset="1" stop-color="#244d52"/></linearGradient>
<linearGradient id="gpt2-summarization-violet" x2="1" y2="1"><stop stop-color="#d2c0fa"/><stop offset="1" stop-color="#8e78b1"/></linearGradient>
<filter id="gpt2-summarization-shadow" x="-50%" y="-50%" width="200%" height="230%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<style>
.standalone .art-float{animation:gpt2-summarization-float 4s ease-in-out 1;transform-box:fill-box;transform-origin:center}
.standalone .art-pulse{animation:gpt2-summarization-pulse 4s ease-in-out 1}
.standalone .art-flow{animation:gpt2-summarization-flow 4s ease-in-out 1}
@keyframes gpt2-summarization-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes gpt2-summarization-pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes gpt2-summarization-flow{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:16}}
@media(prefers-reduced-motion:reduce){.standalone .art-float,.standalone .art-pulse,.standalone .art-flow{animation:none}}
</style><rect width="800" height="480" fill="url(#gpt2-summarization-bg)"/><ellipse cx="420" cy="236" rx="355" ry="265" fill="url(#gpt2-summarization-glow)"/>
