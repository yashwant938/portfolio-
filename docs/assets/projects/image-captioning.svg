<svg xmlns="http://www.w3.org/2000/svg" class="standalone" viewBox="0 0 800 480" role="img" aria-labelledby="image-captioning-title image-captioning-desc">
<title id="image-captioning-title">Image captioning: from pixels to words</title><desc id="image-captioning-desc">A dimensional landscape frame feeds an image encoder, then connects to floating word capsules.</desc>
<defs>
<linearGradient id="image-captioning-bg" x2="1" y2="1"><stop stop-color="#333143"/><stop offset="1" stop-color="#151e2a"/></linearGradient>
<radialGradient id="image-captioning-glow"><stop stop-color="#b3a3d1" stop-opacity=".2"/><stop offset="1" stop-color="#b3a3d1" stop-opacity="0"/></radialGradient>
<linearGradient id="image-captioning-paper" x2=".9" y2="1"><stop stop-color="#fbf6e6"/><stop offset="1" stop-color="#c6d2bc"/></linearGradient>
<linearGradient id="image-captioning-glass" x2="1" y2="1"><stop stop-color="#bdf8da" stop-opacity=".48"/><stop offset=".5" stop-color="#a4e7d0" stop-opacity=".08"/><stop offset="1" stop-color="#90cfc7" stop-opacity=".36"/></linearGradient>
<linearGradient id="image-captioning-metal" x2=".9" y2="1"><stop stop-color="#cce5c0"/><stop offset=".45" stop-color="#608f85"/><stop offset="1" stop-color="#244d52"/></linearGradient>
<linearGradient id="image-captioning-violet" x2="1" y2="1"><stop stop-color="#d2c0fa"/><stop offset="1" stop-color="#8e78b1"/></linearGradient>
<filter id="image-captioning-shadow" x="-50%" y="-50%" width="200%" height="230%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<style>
.standalone .art-float{animation:image-captioning-float 4s ease-in-out 1;transform-box:fill-box;transform-origin:center}
.standalone .art-pulse{animation:image-captioning-pulse 4s ease-in-out 1}
.standalone .art-flow{animation:image-captioning-flow 4s ease-in-out 1}
@keyframes image-captioning-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes image-captioning-pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes image-captioning-flow{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:16}}
@media(prefers-reduced-motion:reduce){.standalone .art-float,.standalone .art-pulse,.standalone .art-flow{animation:none}}
</style><rect width="800" height="480" fill="url(#image-captioning-bg)"/><ellipse cx="420" cy="236" rx="355" ry="265" fill="url(#image-captioning-glow)"/>
<g stroke="#c5e8d8" opacity=".075" fill="none"><path d="M80 344 397 179 720 344M80 380 397 215 720 380M145 414 397 282 656 414"/><path d="m163 297 254 133m-181-172 297 156m-223-195 320 168m-172-150-295 156m221-194-321 168"/></g>
