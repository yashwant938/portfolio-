<path d="m431 216 16 15 38-36" fill="none" stroke="#d5f5ad" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</g></g>
<g transform="rotate(-6 620 137)"><g class="art-float"><rect x="560" y="93" width="135" height="90" rx="15" fill="#29484a"/><rect x="560" y="87" width="135" height="90" rx="15" fill="#caddbd"/><path d="M579 111h19m-19 12h12" stroke="#597663" stroke-width="5" stroke-linecap="round"/><text x="579" y="153" fill="#284039" font-family="Arial,sans-serif" font-size="20" font-weight="700">EVIDENCE</text><circle cx="675" cy="105" r="5" fill="#628c64"/></g></g>
