<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="llvm-bugsquad-title llvm-bugsquad-desc" class="standalone">
<title id="llvm-bugsquad-title">A compiler investigation workbench</title><desc id="llvm-bugsquad-desc">A dimensional terminal stands on an isolated platform, surrounded by orbiting source, diagnostic and regression artifacts.</desc>
