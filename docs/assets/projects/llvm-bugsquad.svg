<radialGradient id="llvm-bugsquad-halo"><stop stop-color="#bde785" stop-opacity=".18"/><stop offset="1" stop-color="#bde785" stop-opacity="0"/></radialGradient>
<pattern id="llvm-bugsquad-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8aa893" stroke-width=".6" opacity=".15"/></pattern>
<linearGradient id="llvm-bugsquad-top-lime" x2="0.8" y2="1"><stop stop-color="#d8f3a1"/><stop offset="1" stop-color="#72984f"/></linearGradient><linearGradient id="llvm-bugsquad-front-lime" x2="0.8" y2="1"><stop stop-color="#748a59"/><stop offset="1" stop-color="#283b28"/></linearGradient><linearGradient id="llvm-bugsquad-side-lime" x2="0.8" y2="1"><stop stop-color="#385243"/><stop offset="1" stop-color="#182821"/></linearGradient><linearGradient id="llvm-bugsquad-top-teal" x2="0.8" y2="1"><stop stop-color="#9ce5d2"/><stop offset="1" stop-color="#427c78"/></linearGradient><linearGradient id="llvm-bugsquad-front-teal" x2="0.8" y2="1"><stop stop-color="#518780"/><stop offset="1" stop-color="#173d3e"/></linearGradient><linearGradient id="llvm-bugsquad-side-teal" x2="0.8" y2="1"><stop stop-color="#355e64"/><stop offset="1" stop-color="#172e38"/></linearGradient><linearGradient id="llvm-bugsquad-top-violet" x2="0.8" y2="1"><stop stop-color="#c5b9fc"/><stop offset="1" stop-color="#746399"/></linearGradient><linearGradient id="llvm-bugsquad-front-violet" x2="0.8" y2="1"><stop stop-color="#7b6b9e"/><stop offset="1" stop-color="#322940"/></linearGradient><linearGradient id="llvm-bugsquad-side-violet" x2="0.8" y2="1"><stop stop-color="#534465"/><stop offset="1" stop-color="#241f37"/></linearGradient>
</defs>
<style>.standalone .art-float{animation:llvm-bugsquad-float 4s ease-in-out 1}.standalone .art-pulse{animation:llvm-bugsquad-pulse 4s ease-in-out 1}.standalone .art-flow{stroke-dasharray:8 10;animation:llvm-bugsquad-flow 4s ease-in-out 1}@keyframes llvm-bugsquad-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes llvm-bugsquad-pulse{0%,100%{opacity:1}50%{opacity:.5}}@keyframes llvm-bugsquad-flow{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:36}}@media(prefers-reduced-motion:reduce){.standalone .art-float,.standalone .art-pulse,.standalone .art-flow{animation:none!important}}</style>
