</g></g>
<g transform="rotate(6 284 265)"><g class="art-float">
<rect x="201" y="181" width="185" height="159" rx="17" fill="#5b5674"/><rect x="201" y="173" width="185" height="159" rx="17" fill="url(#newsscript-violet)"/>
<rect x="220" y="194" width="57" height="51" rx="8" fill="#5d5773"/><path d="m238 207 22 13-22 13Z" fill="#d8d3de"/><path d="M293 206h69m-69 16h48M222 268h139m-139 17h119m-119 17h70" stroke="#635b78" stroke-width="6" stroke-linecap="round"/>
</g></g>
<path class="art-flow" d="M389 251c46 0 32-92 95-92" fill="none" stroke="#c6d8ad" stroke-width="3" stroke-dasharray="4 10"/><circle cx="430" cy="222" r="7" fill="#cce7a6" class="art-pulse"/>
<g transform="rotate(7 585 242)"><g class="art-float">
<path d="M491 136q0-24 27-24h134q24 0 24 26v207q0 25-26 25H491Z" fill="#849b8b"/>
<path d="M492 125q0-26 28-26h119v240q0 18 19 18H492Z" fill="url(#newsscript-paper)"/>
