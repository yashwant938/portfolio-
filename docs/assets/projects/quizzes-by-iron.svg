    <title id="quizzes-by-iron-title">Quizzes by Iron — ideas in play</title><desc id="quizzes-by-iron-desc">Sculptural quiz cards orbit a three-level game podium. A bright check mark, playful question mark, and connected rings suggest a responsive learning game.</desc>
    <defs>
      <radialGradient id="quizzes-by-iron-bg" cx="48%" cy="36%" r="76%"><stop stop-color="#233740"/><stop offset="1" stop-color="#0c1722"/></radialGradient>
      <linearGradient id="quizzes-by-iron-ivory" x2="0.85" y2="1"><stop stop-color="#fff5df"/><stop offset="1" stop-color="#c8c8b2"/></linearGradient>
      <linearGradient id="quizzes-by-iron-green" x2="0.9" y2="1"><stop stop-color="#d4f596"/><stop offset="1" stop-color="#70b692"/></linearGradient>
      <linearGradient id="quizzes-by-iron-purple" x2="0.8" y2="1"><stop stop-color="#d8c4ff"/><stop offset="1" stop-color="#8475b3"/></linearGradient>
      <linearGradient id="quizzes-by-iron-coral" x2="1" y2="1"><stop stop-color="#ffccae"/><stop offset="1" stop-color="#d58078"/></linearGradient>
      <radialGradient id="quizzes-by-iron-glass" cx="28%" cy="24%"><stop stop-color="#d6fff0"/><stop offset="0.35" stop-color="#77c4be"/><stop offset="1" stop-color="#286570"/></radialGradient>
      <filter id="quizzes-by-iron-shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="17" stdDeviation="15" flood-color="#030b14" flood-opacity="0.42"/></filter>
      <pattern id="quizzes-by-iron-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9bdaca" stroke-opacity="0.045"/></pattern>
    </defs>
    <style>
      .standalone .art-float { animation:quizzes-by-iron-float 4s ease-in-out 1; }
      .standalone .art-pulse { animation:quizzes-by-iron-pulse 4s ease-in-out 1; }
      .standalone .art-flow { stroke-dasharray:8 10; animation:quizzes-by-iron-flow 4s ease-in-out 1; }
      @keyframes quizzes-by-iron-float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-8px) } }
      @keyframes quizzes-by-iron-pulse { 0%,100% { opacity:1 } 50% { opacity:.65 } }
      @keyframes quizzes-by-iron-flow { 0%,100% { stroke-dashoffset:0 } 50% { stroke-dashoffset:36 } }
      @media(prefers-reduced-motion:reduce) { .standalone .art-float,.standalone .art-pulse,.standalone .art-flow { animation:none } }
    </style>
